#
# This project has migrated from Render to Cloudflare Workers.
# This file is no longer used for deployment.
#
# To deploy the backend to Cloudflare Workers:
#   cd backend
#   wrangler login
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put EMAIL_USER
#   wrangler secret put EMAIL_PASS
#   wrangler secret put SMTP_HOST
#   wrangler secret put SMTP_PORT
#   wrangler secret put APP_URL
#   wrangler secret put FRONTEND_URL
#   wrangler secret put NODE_ENV
#   wrangler deploy
#
# See backend/wrangler.toml for the Cloudflare Workers configuration.
